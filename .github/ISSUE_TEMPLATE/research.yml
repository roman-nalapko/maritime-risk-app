name: Research task
description: Domain, data, usability, or AI investigation
title: "[Research]: "
labels: ["type:research"]
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
      description: Which decision will this research enable?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: List required authoritative sources, datasets, reviewers, or participants.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable and acceptance criteria
      placeholder: "- [ ] Decision memo or validated artifact"
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and limitations
      description: Include uncertainty, bias, privacy, licensing, and misuse considerations.
    validations:
      required: true

