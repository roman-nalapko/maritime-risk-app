name: Feature
description: A user-facing or engineering capability
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What user or research outcome should this change produce?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: State what is included and explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Observable criterion"
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Methodology, privacy, and data impact
      description: Identify affected coefficients, sources, personal data, or risk claims. Write “none” when not applicable.
    validations:
      required: true

